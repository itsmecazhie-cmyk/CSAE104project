<!DOCTYPE html>
<html lang="en">
<head>
<title>HTML Layout - Grid</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {box-sizing: border-box;}
body {font-family: Arial, Helvetica, sans-serif;}
​
.container {
  display: grid;
  grid-template-areas:
    "header header header"
    "menu content content1"
    "footer footer footer";
  grid-template-columns: 1fr 3fr;
}
​
/* header */
.container header {
  grid-area: header;
  background-color: #666;
  padding: 20px;
  text-align: center;
  color: white;
}
​
.container header h1 {
  font-size: 1rem;
}
​
/* navigation menu */
nav {
  grid-area: menu;
  background-color: #ccc;
  padding: 15px;
}
​
/* Style list inside nav menu */
nav ul {
  list-style-type: none;
  padding: 0;
}
​
/* Style the content */
article {
  grid-area: content;
  background-color: #f1f1f1;
  padding: 15px;
}
​
article h2 {
  font-size: 2rem;
}
​
/* Style the footer */
footer {
  grid-area: footer;
  background-color: #888;
  padding: 10px;
  text-align: center;
  color: white;
}
​
